schema_version: speech_dataset_spec_v1.2
dataset:
  id: aishell5
  name: AISHELL-5
  version: unversioned
  split: all
  description: >-
    AISHELL-5 中文车内多通道多人会话数据集。完整官方发布包含 train、Dev、Eval1、Eval2
    和约 40 小时无说话人语音的 Noise；RAW 保留单一完整官方归档，同时保留历史上已展开的
    Eval1/Eval2 对象。
  subsets_note: >-
    train/dev/eval1/eval2/noise 是官方归档中的一级物理分区；Dev 在平台规范中对应 dev，
    Eval1/Eval2 均为 test，Noise 是不含说话人语音和转写的辅助非语音分区。
  subsets:
    - id: train
      split: train
      num_samples: 568
    - id: dev
      split: dev
      num_samples: 18
    - id: eval1
      split: test
      num_samples: 18
    - id: eval2
      split: test
      num_samples: 18
    - id: noise
      num_samples: 60

status: raw

